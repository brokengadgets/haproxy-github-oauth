name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  zizmor:
    name: Audit GitHub Actions workflows
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run zizmor
        uses: zizmorcore/zizmor-action@45d7276c9ca790aabd705e31ca99c6185c3e76dd # v0.8.1
        with:
          advanced-security: false

  test:
    name: Vet, test, and lint
    needs: zizmor
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Run go vet
        run: go vet ./...

      - name: Run unit tests
        run: go test -race -count=1 ./...

      - name: Run integration tests
        run: go test -race -count=1 -tags integration ./tests/integration/...

      - name: Install Lua and shell check tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends lua5.4 luarocks liblua5.4-dev shellcheck
          sudo luarocks --lua-version=5.4 install busted
          sudo luarocks --lua-version=5.4 install luacheck

      - name: Lint shell scripts and Lua
        run: |
          shellcheck scripts/*.sh
          luacheck haproxy/lua/

      - name: Run HAProxy Lua JWT tests
        run: busted --pattern "_test" haproxy/lua/
